# ============================================================
# Improved sector taxonomy for B2B company segmentation
# Project: Ooredoo Business prospect classification
# Data used for improvement: rne_companies.csv sample (958 rows)
# Purpose:
# Classify companies into 8 sectors from the activity column.
# ============================================================

version: "1.2"

categories:
  - retail
  - manufacturing
  - transport
  - tourism
  - healthcare
  - education
  - financial_services
  - others

# Priority order is important.
# Strong/specific sectors are checked before broad sectors like retail and others.
